syntax = "proto3";

package kvstore;

enum ReadConsistency {
  LINEARIZABLE = 0;   // Must hit Leaseholder / Quorum
  FOLLOWER_STALE = 1; // Served by local replica; bounded staleness
}

enum WriteStrategy {
  QUORUM_CP = 0; // Requires majority (N/2 + 1) ACKs; fails if quorum lost
  ALWAYS_AP = 1; // Accepts write on any available node; logs timestamp
}

message GetRequest {
  string key = 1;
  ReadConsistency consistency = 2;
  uint32 max_staleness_ms = 3; // Used when consistency == FOLLOWER_STALE
}

message GetReply {
  string value = 1;
  bool found = 2;
  uint64 read_timestamp = 3;
  bool is_stale = 4;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string idempotency_key = 3;
  WriteStrategy strategy = 4;
  uint64 timestamp = 5;
}

message PutReply {
  bool success = 1;
  uint32 acks_received = 2;
  string error_message = 3;
}

// ---- internal replica-to-replica messages (added for the lab) ----
message Entry {
  string key = 1;
  string value = 2;
  uint64 timestamp = 3;
}

message DumpRequest {}

message DumpReply {
  repeated Entry entries = 1;
}

service KeyValueStore {
  rpc Get (GetRequest) returns (GetReply);
  rpc Put (PutRequest) returns (PutReply);

  // Internal: apply a write (LWW) or heartbeat (empty key) on a replica.
  rpc Replicate (PutRequest) returns (PutReply);
  // Internal: return all entries, used for anti-entropy after a partition heals.
  rpc Dump (DumpRequest) returns (DumpReply);
}
